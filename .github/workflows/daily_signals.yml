name: Intraday Signal Generator

on:
  schedule:
    - cron: '45 3 * * 1-5'    # 9:15 AM IST — initial trigger
    - cron: '45 9 * * 1-5'    # 3:15 PM IST — safety re-trigger if morning missed
  workflow_dispatch:
    inputs:
      reason:
        description: 'Trigger reason'
        default: 'manual'

concurrency:
  group: intraday-signals
  cancel-in-progress: false    # queue, never cancel

jobs:
  generate-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 25        # each run = one 15-min cycle only

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance pandas numpy supabase aiohttp pytz

      - name: Run ONE signal cycle
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          STOCK_LIST:   ${{ secrets.STOCK_LIST }}
        run: python daily_signal_generator.py

      - name: Self-trigger next run if market still open
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          python - <<'EOF'
          import urllib.request, urllib.error, json, os
          from datetime import datetime
          import pytz

          IST   = pytz.timezone('Asia/Kolkata')
          now   = datetime.now(IST)
          close = now.replace(hour=15, minute=15, second=0, microsecond=0)

          if now.weekday() > 4 or now >= close:
              print(f"Market closed or weekend ({now.strftime('%H:%M IST')}). Not re-triggering.")
              exit(0)

          token = os.environ['GH_PAT']
          url   = "https://api.github.com/repos/harishmani02-dotcom/ai-trading-signals/actions/workflows/daily_signals.yml/dispatches"
          data  = json.dumps({"ref": "main", "inputs": {"reason": "self-trigger"}}).encode()
          req   = urllib.request.Request(url, data=data, method='POST')
          req.add_header("Authorization", f"Bearer {token}")
          req.add_header("Accept",        "application/vnd.github+json")
          req.add_header("Content-Type",  "application/json")

          try:
              urllib.request.urlopen(req, timeout=10)
              print(f"✅ Next run triggered at {now.strftime('%H:%M IST')}")
          except urllib.error.HTTPError as e:
              print(f"❌ Trigger failed: {e.code} {e.reason}")
              exit(1)
          EOF
