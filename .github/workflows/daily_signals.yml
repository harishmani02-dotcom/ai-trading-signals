name: Intraday Signal Generator

on:
  schedule:
    - cron: '45 3 * * 1-5'    # 9:15 AM IST — initial trigger
    - cron: '45 9 * * 1-5'    # 3:15 PM IST — safety re-trigger if morning missed
  workflow_dispatch:
    inputs:
      reason:
        description: 'Trigger reason'
        default: 'manual'

concurrency:
  group: intraday-signals
  cancel-in-progress: false    # queue, never cancel

jobs:
  generate-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 25        # each run = one 15-min cycle only

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance pandas numpy supabase aiohttp pytz

      - name: Run ONE signal cycle
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          STOCK_LIST:   ${{ secrets.STOCK_LIST }}
        run: python daily_signal_generator.py

      - name: Self-trigger next run if market still open
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          python - <<'EOF'
          import urllib.request, urllib.error, json, os, sys
          from datetime import datetime
          import pytz

          IST   = pytz.timezone('Asia/Kolkata')
          now   = datetime.now(IST)

          # Stop triggering after 3:15 PM IST (last cycle — market closes 3:30 PM)
          close = now.replace(hour=15, minute=15, second=0, microsecond=0)

          # Exit silently if weekend or market closed
          if now.weekday() > 4:
              print(f"Weekend — not re-triggering.")
              sys.exit(0)

          if now >= close:
              print(f"Market closing soon ({now.strftime('%H:%M IST')}) — not re-triggering.")
              sys.exit(0)

          # Check token exists
          token = os.environ.get('GH_PAT', '').strip()
          if not token:
              print("❌ GH_PAT secret is missing or empty.")
              sys.exit(1)

          url  = "https://api.github.com/repos/harishmani02-dotcom/ai-trading-signals/actions/workflows/daily_signals.yml/dispatches"
          body = json.dumps({"ref": "main", "inputs": {"reason": "self-trigger"}}).encode()

          req = urllib.request.Request(url, data=body, method='POST')
          req.add_header("Authorization", f"Bearer {token}")
          req.add_header("Accept",        "application/vnd.github+json")
          req.add_header("Content-Type",  "application/json")
          req.add_header("X-GitHub-Api-Version", "2022-11-28")

          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  print(f"✅ Next run triggered at {now.strftime('%H:%M IST')} "
                        f"(HTTP {resp.status})")
          except urllib.error.HTTPError as e:
              body_err = e.read().decode('utf-8', errors='ignore')
              print(f"❌ Trigger failed: {e.code} {e.reason}")
              print(f"   Detail: {body_err}")
              sys.exit(1)
          except urllib.error.URLError as e:
              print(f"❌ Network error: {e.reason}")
              sys.exit(1)
          EOF
